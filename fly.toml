# fly.toml app configuration file generated for fv-calixto on 2026-02-13T23:29:33Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fv-calixto'
primary_region = 'ams'

[build]
  dockerfile = "Dockerfile"
  [build.args]
    OPENCLAW_DOCKER_APT_PACKAGES = "vim"
    # To edit config as node user (avoids permission issues):
    # su -s /bin/bash node -c "vim /data/openclaw.json"

[env]
  NODE_ENV = "production"
  OPENCLAW_PREFER_PNPM = "1"
  #session related config, approved devices, etc
  OPENCLAW_STATE_DIR = "/data"
  # node home dir, where openclaw stores memory files
  HOME = "/data/home"
  NODE_OPTIONS = "--max-old-space-size=1536"
  OPENCLAW_GATEWAY_PORT = "3000"

[processes]
  app = "node dist/index.js gateway --allow-unconfigured --port 3000 --bind lan"
  # escape hatch for deploying without launching openclaw
  #app = "sleep infinity"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"

[mounts]
  source = "openclaw_data"
  destination = "/data"
